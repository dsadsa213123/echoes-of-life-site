<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b09"><title>Echoes of Life — V2.3.3</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#080b09;color:#e6e5dc;font-family:'Courier New',monospace;line-height:1.65}a{text-decoration:none;color:inherit}button{font:inherit}.noise{position:fixed;inset:0;pointer-events:none;z-index:99;opacity:.025;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.05) 4px)}header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:12px 4vw;background:rgba(7,10,8,.95);border-bottom:1px solid #303830}.brand{width:185px}.brand svg{width:100%;display:block}.nav{display:flex;gap:18px}.nav a{font-size:11px;color:#a2aaa0;padding:6px}.nav a:hover{color:#f0eee4;transform:translateY(-1px)}.menu{display:none;background:#111611;color:#eee;border:1px solid #4a5548;padding:7px 10px}.hero{min-height:72vh;display:grid;align-items:end;padding:110px 7vw 84px;background:linear-gradient(90deg,rgba(3,6,4,.9),rgba(3,6,4,.34)),linear-gradient(180deg,#18231d,#40382c);position:relative}.hero.city{background:linear-gradient(90deg,rgba(3,6,4,.82),rgba(3,6,4,.28)),linear-gradient(180deg,#202c38,#b97c5a 65%,#26372b)}.hero h1{font-size:clamp(4rem,11vw,8rem);line-height:.84;margin:14px 0;color:#efebe0}.kicker,.code,.meta,.count{font-size:9px;letter-spacing:.14em;color:#b98247}.tagline{font-size:14px;letter-spacing:.17em}.copy{max-width:650px;color:#a8b0a7}.section{padding:76px 7vw}.head{max-width:820px;margin-bottom:34px}.head h2{font-size:clamp(2rem,4vw,3.4rem);line-height:1;margin:9px 0 12px}.head p,.card p{color:#929b91}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,.state,.choice{background:#101510;border:1px solid #313a31;padding:24px;transition:.18s}.card:hover,.state:hover,.choice:hover{transform:translateY(-3px);border-color:#707b6d;background:#141a14;box-shadow:7px 7px 0 rgba(0,0,0,.2)}.button,.back{display:inline-flex;margin-top:24px;border:1px solid #4a5548;background:#121811;color:#e3e4dc;padding:11px 15px;font-size:10px;letter-spacing:.1em;box-shadow:4px 4px 0 rgba(0,0,0,.35)}.state-grid,.type-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:980px}.state{display:block;min-height:170px}.choice-list{display:grid;gap:12px;max-width:980px}.choice{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:16px}.choice strong{font-size:1.35rem}.choice small{display:block;color:#788276;font-size:9px;letter-spacing:.1em}.choice-arrow{font-size:9px;color:#a7afa3}.weapon{max-width:1180px;margin:auto;border:1px solid #303830;background:#0d120e;overflow:hidden}.weapon-art{padding:12px;background:#070907;border-bottom:1px solid #303830}.weapon-art svg{display:block;width:100%;height:auto}.weapon-body{padding:34px 40px}.weapon-body h1{font-size:clamp(2.8rem,6vw,5rem);margin:8px 0 20px;line-height:.9}.weapon-meta{display:flex;justify-content:space-between}.weapon-layout{display:grid;grid-template-columns:1.35fr .85fr;gap:30px}.weapon-description p{font-size:1rem;line-height:1.85;color:#b4bbb2}.specs{border:1px solid #283129}.spec{display:grid;grid-template-columns:1fr 1fr;padding:10px 13px;border-bottom:1px solid #202820;font-size:10px}.spec:last-child{border:0}.spec span:first-child{color:#6f796e}.spec span:last-child{text-align:right;color:#c7cbc3}.statebox{margin-top:28px;padding:16px 18px;background:#121711;border-left:2px solid #b98247}.statebox strong{font-size:9px;color:#b98247;letter-spacing:.15em}.statebox p{margin:6px 0 0;color:#b1b8ae}.footer{display:flex;justify-content:space-between;padding:28px 4vw;border-top:1px solid #303830;color:#687268;font-size:9px;letter-spacing:.1em}.mark{display:inline-grid;place-items:center;width:24px;height:24px;border:1px solid #536052;margin-right:8px}.version{margin-left:14px;color:#4d574e}@media(max-width:900px){.nav{gap:8px}.grid,.weapon-layout{grid-template-columns:1fr 1fr}}@media(max-width:650px){header{padding:11px 16px}.brand{width:145px}.menu{display:block}.nav{display:none;position:absolute;left:12px;right:12px;top:62px;padding:13px;background:#0c100d;border:1px solid #303830;flex-direction:column}.nav.open{display:flex}.hero{min-height:70vh;padding:90px 18px 54px}.section{padding:58px 18px}.grid,.state-grid,.type-grid,.weapon-layout{grid-template-columns:1fr}.choice{grid-template-columns:34px 1fr}.choice-arrow{grid-column:2}.weapon-body{padding:25px 18px}.weapon-meta{flex-direction:column;gap:7px}.spec{grid-template-columns:1fr}.spec span:last-child{text-align:left}.footer{flex-direction:column;gap:12px}}</style></head><body><div class="noise"></div><div id="app"></div><script>const svg={logo:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180"><rect width="700" height="180" fill="none"/><g fill="#eee9dc" font-family="monospace" font-weight="700" font-size="72"><text x="26" y="82">ECHOES</text><text x="182" y="154">OF LIFE</text></g><path d="M26 166h648" stroke="#b98247" stroke-width="4"/></svg>`,akm:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1774 887"><rect x="20" y="20" width="1734" height="847" fill="#0b0d0b" stroke="#66645c" stroke-width="22"/><rect x="110" y="130" width="1554" height="630" fill="#513824"/><g stroke="#2d2016" stroke-width="12"><path d="M110 260h1554M110 420h1554M110 580h1554M110 735h1554"/></g><g stroke="#171816" stroke-width="20" stroke-linejoin="round"><path d="M170 385l240-90 210 12 270-38 200 56 40 80-160 20-150-42-250 30-180-25z" fill="#68442c"/><path d="M505 280h320l55 55-75 70H505z" fill="#252a27"/><path d="M805 330h260l100 60-45 95H825z" fill="#765034"/><path d="M1065 385h430l70 25-25 45h-475z" fill="#2c312e"/><path d="M520 445h92v170l-55 36-55-35z" fill="#68462f"/><path d="M760 465q90 35 120 160l-92 45q-34-106-100-148z" fill="#252a27"/></g><g stroke="#d09a5c" stroke-width="9" opacity=".55"><path d="M210 350l160-20M910 310l110-14M960 415l120-18M260 470l150-15"/></g></svg>`,glock:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024"><rect x="20" y="20" width="1496" height="984" fill="#0b0d0b" stroke="#66645c" stroke-width="22"/><rect x="110" y="130" width="1316" height="760" fill="#513824"/><g stroke="#2d2016" stroke-width="12"><path d="M110 300h1316M110 470h1316M110 640h1316M110 815h1316"/></g><g transform="translate(300 330)" stroke="#171816" stroke-width="22" stroke-linejoin="round"><path d="M0 55h700l78 50v100H0z" fill="#3e433f"/><path d="M605 205h140l45 42v295l-120 55-55-34-35-270z" fill="#2a2e2a"/><path d="M130 212h555v70H130z" fill="#252a27"/><path d="M285 178h160v50H285z" fill="#454a44"/></g><g stroke="#caa06e" stroke-width="8" opacity=".45"><path d="M180 235l110-45M1010 690l160-40M1040 820l180-30"/></g></svg>`};const nav=[['HOME','home'],['WORLD','world'],['SYSTEMS','systems'],['WEAPONS','weapons'],['LOCATIONS','locations'],['INFECTED','infected'],['DEVLOG','devlog'],['CONTACTS','contacts'],['LOGIN','login']];function header(){return `<header><a class="brand" href="#home"><img src="data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg.logo)}"></a><nav class="nav" id="nav">${nav.map(x=>`<a href="#${x[1]}">${x[0]}</a>`).join('')}</nav><button class="menu" id="menu">☰</button></header>`}function footer(){return `<footer class="footer"><div><span class="mark">E</span>ECHOES OF LIFE / PROJECT<span class="version">// V2.3.3</span></div><span>SURVIVAL. EXPLORATION. DISCOVERY.</span></footer>`}function frame(body){document.querySelector('#app').innerHTML=header()+body+footer();document.querySelector('#menu').onclick=()=>document.querySelector('#nav').classList.toggle('open');document.querySelectorAll('a,button,.card,.state,.choice').forEach(x=>{x.onpointerenter=()=>tone(520,.012,.035);x.onclick=()=>tone(190,.022,.065)});window.scrollTo(0,0)}function tone(f,v,d){try{const c=window._c||(window._c=new AudioContext),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.01)}catch{}}function weapon(id){const d=id==='akm'?{n:'AKM',sub:'RIFLE — 7.62×39 MM',art:'akm',paras:['Простой и знакомый автомат. Он использует распространённый патрон 7.62×39 мм, а массовое производство и простая конструкция сделали его одним из самых известных и распространённых автоматов своего времени.','Он прошёл через десятки конфликтов, сменил множество владельцев и пережил не одно поколение. Многие экземпляры пережили своих владельцев и продолжают работать.','В новом мире таких историй стало только больше. Иногда кажется, что AKM уже видел конец света раньше нас.'],spec:[['TYPE','ASSAULT RIFLE'],['CALIBER','7.62×39 MM'],['MAGAZINE','30 ROUNDS'],['ORIGIN','USSR']]}:{n:'GLOCK 17',sub:'PISTOL — 9×19 MM',art:'glock',paras:['Один из тех пистолетов, которые были практически везде ещё до начала эпидемии. Простая конструкция, небольшой вес и распространённый 9x19-мм патрон сделали его привычным выбором для самых разных владельцев.','В новом мире найти его не так сложно. Гораздо сложнее найти человека, который не знает, что это такое.'],spec:[['TYPE','PISTOL'],['CALIBER','9×19 MM'],['MAGAZINE','17 ROUNDS'],['ORIGIN','AUSTRIA']]};frame(`<main><section class="section"><div class="weapon"><div class="weapon-art"><img src="data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg[d.art])}"></div><div class="weapon-body"><div class="weapon-meta"><span class="meta">WEAPONS / DEFAULT</span><span class="meta">ARCHIVE RECORD</span></div><h1>${d.n}</h1><div class="weapon-layout"><div class="weapon-description"><h3>${d.sub}</h3>${d.paras.map(p=>`<p>${p}</p>`).join('')}<div class="statebox"><strong>DEFAULT</strong><p>Оружие уже было в употреблении. Есть небольшие царапины и следы эксплуатации, но оно всё ещё исправно.</p></div></div><div class="specs">${d.spec.map(s=>`<div class="spec"><span>${s[0]}</span><span>${s[1]}</span></div>`).join('')}</div></div><a class="back" href="#default-${id==='akm'?'rifles':'pistols'}">← BACK TO ARCHIVE</a></div></div></section></main>`)}function categories(state){const ts=[['pistols','PISTOLS'],['rifles','RIFLES'],['smgs','SMGs'],['sniper-rifles','SNIPER RIFLES'],['machine-guns','MACHINE GUNS'],['special','SPECIAL']];frame(hero('WEAPONS // '+state.toUpperCase(),state.toUpperCase(),state==='default'?'Оружие уже было в употреблении, но сохранилось в рабочем состоянии.':'Использованное оружие с индивидуальными изменениями.')+`<main><section class="section"><div class="type-grid">${ts.map((t,i)=>`<a class="state" href="#${state}-${t[0]}"><span class="code">0${i+1}</span><h3>${t[1]}</h3><p>Категория оружия.</p></a>`).join('')}</div></section></main>`)}function category(state,type){let e=state==='default'&&type==='pistols'?`<a class="choice" href="#glock-17"><span class="choice-index">01</span><span><strong>GLOCK 17</strong><small>PISTOL — 9×19 MM</small></span><span class="choice-arrow">OPEN →</span></a>`:state==='default'&&type==='rifles'?`<a class="choice" href="#akm"><span class="choice-index">01</span><span><strong>AKM</strong><small>RIFLE — 7.62×39 MM</small></span><span class="choice-arrow">OPEN →</span></a>`:`<div class="card"><span class="count">EMPTY</span><h3>NO RECORDS YET</h3><p>Эта категория пока пустая.</p></div>`;frame(hero('WEAPONS // '+state.toUpperCase()+' // '+type.toUpperCase(),type.replaceAll('-',' ').toUpperCase(),'Выбери оружие, чтобы открыть его отдельную запись.')+`<main><section class="section"><div class="choice-list">${e}</div></section></main>`)}function hero(k,h,p){return `<section class="hero"><div><span class="kicker">${k}</span><h1>${h}</h1><p class="copy">${p}</p></div></section>`}function render(){let h=location.hash.slice(1)||'home';if(h==='home')frame(`<section class="hero city"><div><span class="kicker">ARCHIVE // ACTIVE</span><h1>ECHOES<br>OF LIFE</h1><p class="tagline">SURVIVAL. EXPLORATION. DISCOVERY.</p><p class="copy">Рабочая версия проекта о мире после эпидемии: люди, места, оружие, истории и то, что осталось.</p><a class="button" href="#world">EXPLORE WORLD →</a></div></section><section class="section"><div class="head"><span class="code">PROJECT</span><h2>A WORLD THAT REMEMBERS.</h2><p>Сайт собирает материалы проекта и постепенно расширяется вместе с ним.</p></div><div class="grid"><a class="card" href="#weapons"><span class="count">01</span><h3>WEAPONS</h3><p>Оружейный архив.</p></a><a class="card" href="#locations"><span class="count">02</span><h3>LOCATIONS</h3><p>Места старого мира.</p></a><a class="card" href="#infected"><span class="count">03</span><h3>INFECTED</h3><p>То, что осталось после заражения.</p></a></div></section>`);else if(h==='weapons')frame(hero('HOME // WEAPONS','WEAPONS','Оружейный архив Echoes of Life.')+state());else if(h==='default'||h==='custom')categories(h);else if(h==='glock-17'||h==='akm')weapon(h);else if(h.startsWith('default-'))category('default',h.slice(8));else if(h.startsWith('custom-'))category('custom',h.slice(7));else{const d={world:['WORLD','Мир после эпидемии: города, убежища, лаборатории и военные объекты.'],systems:['SYSTEMS','Основные системы выживания, исследования и развития.'],locations:['LOCATIONS','Города, здания и большие объекты.'],infected:['INFECTED','То, что осталось после заражения.'],devlog:['DEVLOG','Дневник разработки Echoes of Life.'],contacts:['CONTACTS','Связь с проектом.'],login:['LOGIN','Локальный профиль сайта без серверного аккаунта.']}[h]||['PAGE','В разработке.'];frame(hero('HOME // '+d[0],d[0],d[1])+`<main><section class="section"><div class="grid">${card('IN DEVELOPMENT','Проект продолжает развиваться.')} ${card('CLASSIFIED','Некоторые данные пока закрыты.')} ${card('UNKNOWN','Ответы будут добавляться постепенно.')}</div></section></main>`)}function state(){return `<section class="section"><div class="state-grid"><a class="state" href="#default"><span class="code">01</span><h3>DEFAULT</h3><p>Уже использованное, но исправное оружие.</p></a><a class="state" href="#custom"><span class="code">02</span><h3>CUSTOM</h3><p>Использованное оружие с индивидуальными изменениями.</p></a></div></section>`}function card(n,p){return `<article class="card"><h3>${n}</h3><p>${p}</p></article>`}window.addEventListener('hashchange',render);render();</script></body></html>
